name: Remove duplicate Nuevo uruguayo entry

on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-nuevo-uruguayo.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate entry from trabajos presentados
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '            <li><span class="year">2012</span><span class="ref">Nuevo uruguayo: ¿una nueva condición subjetiva? III Coloquio de Emergencia Social, CDI.</span></li>\n'
          if target not in s:
              raise SystemExit('Target line not found')
          s = s.replace(target, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Eliminar duplicado de Nuevo uruguayo" || exit 0
          git push
