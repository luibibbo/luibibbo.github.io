name: Replace supervision entry

on:
  push:
    paths:
      - '.github/workflows/replace-supervision-entry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old listing and update sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<li><span class="year">2020</span><span class="ref">Intercambio sobre la supervisión. Actividad científica APU. Comentado por Psic. Cecilia Lauriña, APA.</span></li>'
          new = '<li><span class="year">2020</span><span class="ref"><em>Acerca de la supervisión psicoanalítica: una aproximación teórica y un testimonio.</em> Actividad científica APU, Montevideo, 31 de julio de 2020. <a href="texto-acerca-de-la-supervision-psicoanalitica.html">Leer texto</a></span></li>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old supervision entry, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')

          sp = Path('sitemap.xml')
          sm = sp.read_text(encoding='utf-8')
          sm = sm.replace('<lastmod>2026-09-10</lastmod>', '<lastmod>2026-09-12</lastmod>', 1)
          url = 'https://luibibbo.github.io/texto-acerca-de-la-supervision-psicoanalitica.html'
          if url not in sm:
              block = '''  <url>\n    <loc>https://luibibbo.github.io/texto-acerca-de-la-supervision-psicoanalitica.html</loc>\n    <lastmod>2026-09-12</lastmod>\n    <changefreq>yearly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'''
              sm = sm.replace('</urlset>', block + '</urlset>')
          sp.write_text(sm, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "Reemplazar entrada de supervisión de 2020" || exit 0
          git push
